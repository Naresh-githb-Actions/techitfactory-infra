name: Terraform CI

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  TF_VERSION: "1.6.0"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bootstrap

    steps:
        - name: Checkout
          uses: actions/checkout@v4


        - name: Show GitHub OIDC Context
          run: |
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Actor: $GITHUB_ACTOR"
        
        - name: Verify AWS Role ARN Configuration
          env:
              ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          run: |
            echo "Role ARN is configured: $([ -n "$ROLE_ARN" ] && echo yes || echo no)"
            echo "Account: $(echo "$ROLE_ARN" | cut -d: -f5)"
            echo "Role: $(echo "$ROLE_ARN" | sed 's#^arn:aws:iam::[0-9]*:role/##')'"
        - name: Debug OIDC Token
          shell: bash
          run: |
            echo "ACTIONS_ID_TOKEN_REQUEST_URL exists: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN exists: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
                  
            RESPONSE=$(curl -sS \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
                  
            TOKEN=$(echo "$RESPONSE" | jq -r '.value')
                  
            echo "OIDC token received: $([ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] && echo yes || echo no)"
                  
            PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
                  
            echo "OIDC claims:"
            echo "$PAYLOAD" | jq '{
              iss,
              aud,
              sub,
              repository,
              ref,
              repository_owner,
              event_name
            }'    
            

    
        # OIDC temporarily disabled for diagnostics
        - name: Configure AWS Credentials (OIDC)
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            aws-region: ${{ env.AWS_REGION }}
            audience: sts.amazonaws.com

        - name: Verify AWS Identity
          run: aws sts get-caller-identity

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: ${{ env.TF_VERSION }}

        - name: Terraform Format Check
          id: fmt
          run: terraform fmt -check -recursive

        - name: Terraform Init
          id: init
          run: terraform init

        - name: Terraform Validate
          id: validate
          run: terraform validate

        - name: Terraform Plan
          id: plan
          run: terraform plan -no-color -out=tfplan